name: Register TER extension key

# One-shot: registers the extension key on extensions.typo3.org so that
# publish-to-ter.yml can publish releases. Dispatched once after merge,
# then removed again.

on:
  workflow_dispatch:

permissions: {}

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tailor
        run: composer global require typo3/tailor:^1 --prefer-dist --no-progress
      - name: Register key
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
        run: php ~/.composer/vendor/bin/tailor ter:register nr_llm_compat
