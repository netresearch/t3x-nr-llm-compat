name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

# The `with:` block (archive-prefix / package-name / extension-key) is
# per-extension, so this file is listed under intentional-drift in
# .github/template.yaml — set this repo's real values here.
jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: nr-llm-compat
      package-name: netresearch/nr-llm-compat
      extension-key: nr_llm_compat
      # No Documentation/ directory yet — nothing renders on docs.typo3.org.
      skip-docs: true
      # Flip once the package has been submitted to Packagist (manual,
      # needs a packagist.org account; no org-level token exists).
      skip-packagist: true
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
