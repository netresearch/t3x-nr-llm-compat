name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# This workflow runs the extension's own test matrix and is the ONE per-extension
# CI value: its `with:` block (php-versions, typo3-versions, matrix-exclude,
# run-functional-tests, db settings, remove-dev-deps, coverage, …) differs per
# extension. It is therefore listed under intentional-drift in
# .github/template.yaml — customise it freely here. The security/quality jobs
# with elevated permissions are drift-enforced in checks.yml; do not duplicate
# them here.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4","8.5"]'
      typo3-versions: '["^13.4","^14.3"]'
      # passionweb/ai-seo-helper caps at TYPO3 ^13.4; on the ^14.3 cells it is
      # removed, its tests self-skip, and PHPStan switches to the config that
      # excludes the files referencing its classes (see the ci:test:php:phpstan
      # composer script).
      # only-for names the versions the dep IS compatible with; it is removed
      # on every other cell.
      remove-dev-deps: '[{"dep":"passionweb/ai-seo-helper","only-for":"^13.4"}]'
      run-functional-tests: true
      # Runs `composer ci:test:repo` = the isolated typo3-solver test
      # environment (Tests/SolverEnvironment), which cannot join the main
      # require-dev resolution (openai-php/client conflict, #8).
      run-repo-checks: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
