name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it, so
# superseded test matrices stop taking runners. Every other run (main, merge
# queue, schedule) gets a group of its own through github.run_id: GitHub keeps
# one pending run per group and cancels the older pending run even when
# cancel-in-progress is off, so a group shared by main pushes and the schedule
# would drop runs. The group sits here in the caller, not in the reusable
# workflow: a caller that invokes ci.yml twice would otherwise put both calls
# in one group and cancel one with the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow runs the extension's own test matrix and is the ONE per-extension
# CI value: its `with:` block (php-versions, typo3-versions, matrix-exclude,
# run-functional-tests, db settings, remove-dev-deps, coverage, …) differs per
# extension. It is therefore listed under intentional-drift in
# .github/template.yaml — customise it freely here. The security/quality jobs
# with elevated permissions are drift-enforced in checks.yml; do not duplicate
# them here.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4","8.5","8.6"]'
      typo3-versions: '["^13.4","^14.3"]'
      # passionweb/ai-seo-helper caps at TYPO3 ^13.4 and georgringer/news at
      # PHP < 8.6. Where a cell removes one, its tests self-skip and PHPStan
      # excludes the files referencing its classes
      # (Build/phpstan/phpstan-installed-dev-deps.php).
      # only-for names the TYPO3 lines the dep IS compatible with; it is
      # removed on every other cell. remove-for-php names the PHP versions it
      # is removed on.
      remove-dev-deps: '[{"dep":"passionweb/ai-seo-helper","only-for":"^13.4"},{"dep":"georgringer/news","remove-for-php":"8.6"}]'
      run-functional-tests: true
      # Runs `composer ci:test:repo` = the isolated typo3-solver test
      # environment (Tests/SolverEnvironment), which cannot join the main
      # require-dev resolution (openai-php/client conflict, #8).
      run-repo-checks: true
      # Every other cell resolves the newest mfd/ai-filemetadata (1.7.1+).
      # Its OpenAiClient bridge has a separate code path for releases before
      # 1.7.1 (no ModifyRequestDataEvent, three constructor parameters); this
      # extra cell runs the unit and functional tests on 1.7.0 for it (#96).
      pin-packages: 'mfd/ai-filemetadata:1.7.0'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
